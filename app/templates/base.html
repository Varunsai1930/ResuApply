<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ResuApply{% endblock %} · ResuApply</title>
  <link rel="icon" href="{{ asset('favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ asset('style.css') }}">
  <script src="{{ asset('forms.js') }}" defer></script>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include "_header.html" %}
  <main id="main" class="wrap">
    {% if msg and MESSAGES.get(msg) %}
      <p class="flash" role="status">{{ MESSAGES[msg] }}</p>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="wrap">Runs on 127.0.0.1. Your data stays in <code>data/</code> on this computer; only content you approve is sent to the AI model.</div>
  </footer>
</body>
</html>
