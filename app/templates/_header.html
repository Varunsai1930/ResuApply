{# The site header every page shares. NAV_ITEMS (templating.py) is the fixed nav; `active` marks the current one. #}
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/jobs">ResuApply</a>
    <nav aria-label="Main">
      {% for key, href, label in NAV_ITEMS %}
        <a href="{{ href }}" {% if active == key %}aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    <span class="local-badge" title="ResuApply runs only on this computer (127.0.0.1)"><span>Local only</span></span>
    {# Shown by theme.js: without JavaScript the app follows the system setting. #}
    <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" hidden>
      <span class="visually-hidden">Dark mode</span>
      <svg class="icon-moon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg class="icon-sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
