[pytest]
testpaths = tests
addopts = -ra
# pytest-timeout (requirements-dev.txt): a test still running after 120 s fails with every thread's stack,
# locally and in CI, instead of hanging the run. The whole suite takes about a minute.
timeout = 120
markers =
    pages(mapping, url=...): the local pages an autofill test serves (tests/autofill_site.py)
