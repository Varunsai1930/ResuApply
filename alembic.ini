# Alembic configuration for developers. The app itself runs "upgrade head" at startup
# (app/db.py, init_db) and doesn't read this file. The database comes from the app's settings
# (RESUAPPLY_DATA_DIR), so no URL is set here.
#
#   alembic revision --autogenerate -m "Add applications.example"   # then review the file
#   alembic upgrade head
[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
